name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright must be importable BEFORE build.py runs: build.py only runs
      # the live-browser suite when `import playwright` succeeds, so installing
      # it afterwards silently downgraded the build to "browser tests skipped".
      - name: Install Python deps
        run: pip install Pillow playwright

      - name: Install Chromium for the browser checks
        run: python3 -m playwright install --with-deps chromium

      # axe-core is vendored, not installed: the accessibility sweep must run
      # with no network and no npm step. A missing file is a build error here,
      # not a skipped check later.
      - name: Check the vendored axe-core is present
        run: python3 -c "import pathlib; p = pathlib.Path('tests/axe.min.js'); s = p.read_text(); assert p.stat().st_size > 500000 and 'axe v4.14.0' in s, 'axe-core missing or wrong version'; print('axe-core vendored:', round(p.stat().st_size/1024), 'KB')"

      # The browser suite is part of build.py (browser_checks.py --serve, real
      # Chromium, offline service worker included) and a failed check fails the
      # build. Never mask it with `|| echo`: a green CI run must mean green.
      # It also runs axe-core from tests/axe.min.js (vendored, MPL-2.0, no npm
      # install needed) — the vendored file is asserted present so a checkout
      # that lost it fails loudly instead of silently skipping accessibility.
      - name: Build and check
        shell: bash
        run: |
          set -o pipefail
          python3 build.py 2>&1 | tee build.log

      # A red run must say WHY where a reviewer can see it: the step log is
      # served from a host some networks cannot reach, so every failing check is
      # lifted into a check-run annotation as well.
      - name: Report failing checks
        if: failure()
        shell: bash
        run: |
          tail -40 build.log || true
          grep -E '✗ FAIL|FAILED|Error|Traceback|Exception|drifted|^  - ' build.log \
            | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # The step log and the artifact both live on hosts some networks cannot
      # reach, so the two proof lines are lifted into check-run annotations as
      # well — that is how a reviewer confirms the new coverage RAN (listeners
      # live in N contexts, axe ran over the seven surfaces) rather than merely
      # being present in the file.
      - name: Publish harness and axe evidence
        if: always()
        shell: bash
        run: |
          grep -E '^evidence: ' build.log | while IFS= read -r line; do
            echo "::notice::${line#evidence: }"
          done || true
          grep -E 'browser_checks.py: [0-9]+ passed|check total drifted' build.log \
            | head -2 | while IFS= read -r line; do echo "::notice::${line}"; done || true

      # The artifact keeps the full build output readable even off the runner.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Independent proof that editing source JSON is enough: one marker per
      # content kind is injected, rebuilt, found in the published output, then
      # the source files are restored and the artifact hash re-checked.
      - name: Prove content edits reach the published site
        run: python3 source/prove_data_only.py
