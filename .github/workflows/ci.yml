name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright must be importable BEFORE build.py runs: build.py only runs
      # the live-browser suite when `import playwright` succeeds, so installing
      # it afterwards silently downgraded the build to "browser tests skipped".
      - name: Install Python deps
        run: pip install Pillow playwright

      - name: Install Chromium for the browser checks
        run: python3 -m playwright install --with-deps chromium

      # The browser suite is part of build.py (browser_checks.py --serve, real
      # Chromium, offline service worker included) and a failed check fails the
      # build. Never mask it with `|| echo`: a green CI run must mean green.
      - name: Build and check
        shell: bash
        run: |
          set -o pipefail
          python3 build.py 2>&1 | tee build.log

      # The runner serves step logs from a host some networks cannot reach; the
      # artifact keeps the full build output readable either way.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Independent proof that editing source JSON is enough: one marker per
      # content kind is injected, rebuilt, found in the published output, then
      # the source files are restored and the artifact hash re-checked.
      - name: Prove content edits reach the published site
        run: python3 source/prove_data_only.py
